<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generatore di Note · Helpdesk IT</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
  .inp{width:100%;border-radius:.5rem;border:1px solid #cbd5e1;background:#fff;padding:.5rem .75rem;font-size:.875rem;color:#0f172a}
  .dark .inp{background:#1e293b;border-color:#475569;color:#e2e8f0}
  .inp:focus{outline:2px solid #0d9488;outline-offset:1px}
  .lbl{display:block;font-size:.8rem;font-weight:600;margin-bottom:.25rem;color:#334155}
  .dark .lbl{color:#cbd5e1}
  .tabbtn[aria-selected=true]{border-color:#0d9488;color:#0d9488;font-weight:600}
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto p-4 md:p-6">

  <header class="flex items-center justify-between mb-5">
    <div>
      <h1 class="text-xl md:text-2xl font-bold">Generatore di note Helpdesk</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Note interne ITSM e comunicazioni per l'utente, pronte da copiare.</p>
    </div>
    <button id="themeBtn" class="rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Cambia tema">Tema</button>
  </header>

  <section class="rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 md:p-5 mb-5">
    <h2 class="font-semibold mb-3">1 · Chi ti scrive e per cosa</h2>
    <div id="topForm"></div>
  </section>
  <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2">2 · Scegli la tipologia</p>
  <div id="types" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 mb-5"></div>

  <div class="space-y-5">
    <section class="rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 md:p-5">
      <h2 id="formTitle" class="font-semibold mb-4"></h2>
      <div id="form" class="space-y-3"></div>
      <div class="mt-4"><button id="clearBtn" class="text-sm rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700">Pulisci campi</button></div>
    </section>

    <section class="rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 md:p-5 flex flex-col">
      <h2 class="font-semibold mb-3">4 · Note pronte da copiare</h2>
      <div class="flex gap-4 overflow-x-auto whitespace-nowrap border-b border-slate-200 dark:border-slate-700 mb-3" role="tablist">
        <button class="tabbtn border-b-2 border-transparent pb-2 text-sm" role="tab" data-tab="int" aria-selected="true">Work Note interna</button>
        <button class="tabbtn border-b-2 border-transparent pb-2 text-sm" role="tab" data-tab="usr" aria-selected="false">Commento per l'utente</button>
        <button class="tabbtn border-b-2 border-transparent pb-2 text-sm" role="tab" data-tab="cls" aria-selected="false">Nota di chiusura</button>
      </div>
      <p id="hint" class="text-xs text-slate-500 dark:text-slate-400 mb-2"></p>
      <div class="grid lg:grid-cols-3 gap-4 items-start">
        <textarea id="out" class="inp lg:col-span-2 min-h-[18rem] font-mono leading-relaxed resize-none" spellcheck="false"></textarea>
        <div id="chk"></div>
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        <button id="copyBtn" class="flex-1 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold px-4 py-2.5">Copia nota</button>
        <button id="saveBtn" class="rounded-lg border border-teal-600 text-teal-700 dark:text-teal-400 font-semibold px-4 py-2.5 hover:bg-teal-50 dark:hover:bg-slate-700">Salva nella cronologia</button>
        <button id="newBtn" class="rounded-lg border border-slate-300 dark:border-slate-600 font-semibold px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700">Nuovo ticket</button>
      </div>
    </section>
  </div>

  <section class="mt-5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 md:p-5">
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <h2 class="font-semibold mr-auto">Note salvate</h2>
      <input id="search" class="inp !w-48" placeholder="Cerca (ticket, utente...)">
      <div class="flex rounded-lg overflow-hidden border border-slate-300 dark:border-slate-600 text-sm">
        <button id="fAll" class="px-3 py-1.5">Tutte</button>
        <button id="fFav" class="px-3 py-1.5">Preferiti</button>
      </div>
    </div>
    <div id="hist" class="grid md:grid-cols-2 xl:grid-cols-3 gap-3"></div>
  </section>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg hidden"></div>

<script>
const STATI=['Risolto al 1° livello','In attesa utente','Scalato al 2° livello','Chiuso: caso particolare'];
const SN=['Sì','No'];
const TYPES={
 pwd:{n:'Reset password / Sblocco AD',tag:'AD',intro:"in merito alla sua richiesta relativa all'account di rete,",f:[
  {id:'tipo',l:'Intervento',t:'sel',o:['Reset password','Sblocco account','Reset e sblocco']},
  {id:'idv',l:'Identità verificata',t:'sel',o:SN},
  {id:'metodo',l:'Metodo di verifica identità',t:'sel',o:['Domanda di sicurezza','Chiamata al numero registrato','Conferma del responsabile','Verifica di persona (badge/documento)','Codice via SMS/email aziendale','Altro (specificare)'],x:{when:'Altro (specificare)',p:'Descrivi il metodo usato',rep:1}}]},
 prn:{n:'Stampante / Periferica',tag:'STAMPANTE',intro:'in merito al problema con la stampante/periferica segnalato,',f:[
  {id:'host',l:'Hostname / IP',t:'txt'},{id:'mod',l:'Modello',t:'txt'},{id:'sede',l:'Reparto / Sede',t:'txt'},
  {id:'err',l:'Errore riscontrato',t:'area'},
  {id:'az',l:'Verifiche rapide (spunta quelle eseguite)',t:'chk',o:['Ping','Riavvio spooler','Reinstallazione driver','Riavvio stampante','Pulizia coda di stampa','Verifica cavo/rete','Pagina di test']}]},
 net:{n:'Rete / VPN',tag:'RETE',intro:'in merito al problema di connettività segnalato,',f:[
  {id:'ip',l:'Indirizzo IP utente',t:'txt'},{id:'conn',l:'Tipo connessione',t:'sel',o:['Wi-Fi','Cavo','VPN']},
  {id:'host',l:'Hostname PC',t:'txt'},{id:'ping',l:'Esito Ping / Traceroute',t:'area'},
  {id:'az',l:'Verifiche rapide (spunta quelle eseguite)',t:'chk',o:['Ipconfig /release /renew','Flush DNS','Riavvio adattatore','Reinstallazione client VPN','Verifica credenziali','Cambio porta/AP']}]},
 pc:{n:'Postazione di lavoro',tag:'POSTAZIONE',intro:'in merito alla sua postazione di lavoro,',f:[
  {id:'tipo',l:'Intervento',t:'sel',o:['Setup nuova postazione','Sostituzione PC/Laptop']},
  {id:'host',l:'Hostname',t:'txt'},{id:'mod',l:'Modello / Asset tag',t:'txt'},
  {id:'az',l:'Verifiche rapide (spunta quelle eseguite)',t:'chk',o:['Join al dominio','Installazione software base','Migrazione dati','Configurazione stampanti','Ritiro vecchia postazione','Aggiornamento inventario']}]},
 sw:{n:'Software',tag:'SOFTWARE',intro:'in merito al problema con il software segnalato,',f:[
  {id:'sw',l:'Software e versione',t:'txt'},{id:'err',l:'Errore / Sintomo',t:'area'},{id:'host',l:'Hostname PC',t:'txt'},
  {id:'az',l:'Verifiche rapide (spunta quelle eseguite)',t:'chk',o:['Installazione','Reinstallazione','Riparazione','Aggiornamento','Pulizia cache/profilo','Verifica licenza','Riavvio PC']}]},
 gen:{n:'Generico / Altro',tag:'GENERICO',intro:'in merito alla sua richiesta,',f:[]}
};
const COMMON_TOP=[{id:'cliente',l:'Cliente',t:'txt',p:'Nome del cliente (firma delle note)'},{id:'ticket',l:'N° ticket',t:'txt',p:'INC0001234'},{id:'utente',l:'Utente',t:'txt',p:'Nome Cognome / username'},{id:'problema',l:'Problema segnalato',t:'area',p:'Cosa non funziona, dal punto di vista dell\'utente'}];
const CH=['Telefono','Email','Portale','Chat','Di persona'];
const CP=['Cliente non risponde','Ticket duplicato','Fuori perimetro'];
const S=i=>d=>d.stato===STATI[i];
const COMMON_BOT=[
 {id:'risultati',l:'Verifiche e risultati (anche cosa NON è stato fatto e perché)',t:'area'},
 {id:'evidenze',l:'Evidenze (errori, log, riferimenti)',t:'area'},
 {id:'allegato',l:'Allegato',t:'flag',l2:'Il ticket ha un allegato (screenshot, log, foto)',x:{when:true,p:'Cosa contiene? (facoltativo)'}},
 {id:'stato',l:'Stato finale',t:'pill',o:STATI},
 {id:'grp',l:'Gruppo destinatario (Assignment Group)',t:'txt',s:S(2)},
 {id:'richiesta',l:'Motivo e richiesta al team destinatario',t:'area',p:'Perché giri il ticket a questo gruppo e cosa ti aspetti che facciano (verifiche ulteriori, identificazione delle cause...)',s:S(2)},
 {id:'inatt',l:"Cosa serve dall'utente",t:'area',s:S(1)},
 {id:'causa',l:'Causa del problema',t:'area',s:S(0)},
 {id:'azris',l:'Azioni che hanno risolto il problema',t:'area',p:'es. profilo ricreato, posta e regole reimportate',s:S(0)},
 {id:'esito',l:'Esito delle azioni',t:'area',s:S(0)},
 {id:'conf',l:"Conferma dell'utente tramite",t:'sel',o:CH,s:S(0)},
 {id:'cp',l:'Caso particolare',t:'sel',o:CP,nodef:1,s:S(3)},
 {id:'cp1',l:'Tentativi di contatto (quando e come)',t:'area',s:d=>S(3)(d)&&d.cp===CP[0]},
 {id:'cp2',l:'N° ticket principale di riferimento',t:'txt',s:d=>S(3)(d)&&d.cp===CP[1]},
 {id:'cp3',l:'Motivo della duplicazione',t:'area',s:d=>S(3)(d)&&d.cp===CP[1]},
 {id:'note',l:'Note aggiuntive',t:'area'}];

const $=s=>document.querySelector(s);
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let cur=null, tab='int', filt='all', data={cliente:LS('cliente')||''}, hist=LS('hist')||[];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),1800)}

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}


const PC=['bg-emerald-600 border-emerald-600','bg-amber-500 border-amber-500','bg-indigo-600 border-indigo-600','bg-slate-600 border-slate-600'];
const HINTS={int:'Work Notes: dettagli tecnici visibili solo al team. Scrivi per un estraneo, senza sigle ambigue.',usr:'Comments: solo ciò che deve vedere il cliente. Niente password o dati riservati.',cls:'Close notes: la nota deve reggersi da sola, comprensibile anche a chi non ha seguito il ticket.'};
function fit(){const o=$('#out');o.style.height='auto';o.style.height=Math.max(288,o.scrollHeight+4)+'px'}
function hint(){$('#hint').textContent=HINTS[tab]+' Il testo è modificabile prima della copia.'}
function renderChk(c){
  const b=$('#chk');b.innerHTML='';b.className='rounded-lg bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 p-3';
  b.appendChild(el('div','text-xs font-semibold uppercase tracking-wide mb-1',c.title));
  c.items.forEach(([l,ok,w])=>b.appendChild(el('div','text-sm '+(ok?'text-emerald-700 dark:text-emerald-400':w?'text-red-600 dark:text-red-400 font-semibold':'text-slate-500 dark:text-slate-400'),(ok?'✔ ':w?'⚠ ':'☐ ')+l)));
}
const PCK=['peer-checked:bg-emerald-600 peer-checked:border-emerald-600 peer-checked:text-white','peer-checked:bg-amber-500 peer-checked:border-amber-500 peer-checked:text-white','peer-checked:bg-indigo-600 peer-checked:border-indigo-600 peer-checked:text-white','peer-checked:bg-slate-600 peer-checked:border-slate-600 peer-checked:text-white'];
const KEEP=['cliente','ticket','utente','problema'];
const pick=()=>{const o={};KEEP.forEach(k=>{if(data[k])o[k]=data[k]});return o};
function resetAll(){data={cliente:data.cliente};cur=null;renderTypes();renderForm();gen();const t=document.querySelector('[data-k="ticket"]');if(t)t.focus()}
function renderTypes(){
  const box=$('#types');box.innerHTML='';box.setAttribute('role','radiogroup');box.setAttribute('aria-label','Tipologia');
  Object.entries(TYPES).forEach(([k,v])=>{
    const l=el('label','block'),r=el('input','sr-only peer');r.type='radio';r.name='type';r.checked=k===cur;
    r.onchange=()=>{cur=k;data=pick();renderForm();gen()};
    l.append(r,el('span','block rounded-lg border px-3 py-3 text-sm font-medium cursor-pointer bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 hover:border-teal-500 peer-checked:bg-teal-600 peer-checked:border-teal-600 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-teal-500 peer-focus-visible:ring-offset-2 dark:peer-focus-visible:ring-offset-slate-900',v.n));
    box.appendChild(l);
  });
}
function field(fd){
  const w=el('div',fd.t==='chk'||fd.t==='pill'||fd.t==='area'?'sm:col-span-2 lg:col-span-3':'');
  const lab=el('label','lbl',fd.l);w.appendChild(lab);
  let i;
  if(fd.t==='pill'){
    if(!data[fd.id])data[fd.id]=fd.o[0];
    i=el('div','grid grid-cols-2 lg:grid-cols-4 gap-2');i.setAttribute('role','radiogroup');
    fd.o.forEach((o,k)=>{const l=el('label','block'),r=el('input','sr-only peer');r.type='radio';r.name=fd.id;r.checked=data[fd.id]===o;r.dataset.k=fd.id;
      r.onchange=()=>{data[fd.id]=o;renderForm();gen()};
      l.append(r,el('span','block rounded-lg border px-3 py-2 text-sm font-medium cursor-pointer text-center border-slate-300 dark:border-slate-600 hover:border-teal-500 peer-focus-visible:ring-2 peer-focus-visible:ring-teal-500 '+PCK[k],o));i.appendChild(l)});
  }else if(fd.t==='sel'){
    i=el('select','inp');if(!fd.nodef)i.appendChild(new Option('Seleziona…',''));fd.o.forEach(o=>i.appendChild(new Option(o,o)));if(data[fd.id]===undefined)data[fd.id]=fd.nodef?fd.o[0]:'';i.value=data[fd.id];i.onchange=()=>{data[fd.id]=i.value;renderForm();gen()};
  }else if(fd.t==='flag'){
    i=el('label','flex items-center gap-2 text-sm cursor-pointer rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2');const c=el('input');c.type='checkbox';c.checked=data[fd.id]===true;c.dataset.k=fd.id;c.onchange=()=>{data[fd.id]=c.checked;renderForm();gen()};i.append(c,fd.l2);
  }else if(fd.t==='chk'){
    i=el('div','flex flex-wrap gap-2');const sel=data[fd.id]=data[fd.id]||[];
    fd.o.forEach(o=>{const l=el('label','flex items-center gap-1.5 text-sm rounded-md border border-slate-300 dark:border-slate-600 px-2 py-1 cursor-pointer');
      const c=el('input');c.type='checkbox';c.checked=sel.includes(o);c.dataset.k=fd.id+'|'+o;c.onchange=()=>{const a=data[fd.id];c.checked?a.push(o):a.splice(a.indexOf(o),1);gen()};
      l.append(c,o);i.appendChild(l)});
  }else{
    i=el(fd.t==='area'?'textarea':'input','inp');if(fd.t==='area')i.rows=2;if(fd.p)i.placeholder=fd.p;i.value=data[fd.id]||'';i.oninput=()=>{data[fd.id]=i.value;if(fd.id==='cliente')LS('cliente',i.value);gen()};
  }
  if(['INPUT','SELECT','TEXTAREA'].includes(i.tagName)){i.id='f_'+fd.id;lab.htmlFor=i.id;i.dataset.k=fd.id}
  w.appendChild(i);
  if(fd.x&&data[fd.id]===fd.x.when){const x=el('input','inp mt-2');x.placeholder=fd.x.p;x.value=data[fd.id+'_x']||'';x.dataset.k=fd.id+'_x';x.oninput=()=>{data[fd.id+'_x']=x.value;gen()};w.appendChild(x)}
  return w;
}
function renderForm(){
  const ae=document.activeElement,fk=ae&&ae.dataset?ae.dataset.k:null;
  const mk=fds=>{const g=el('div','grid sm:grid-cols-2 lg:grid-cols-3 gap-3');fds.forEach(fd=>{if(!fd.s||fd.s(data))g.appendChild(field(fd))});return g};
  const top=$('#topForm');top.innerHTML='';top.appendChild(mk(COMMON_TOP));
  const f=$('#form');f.innerHTML='';
  if(!cur){$('#formTitle').textContent='3 · Dettagli';f.appendChild(el('p','text-sm text-slate-500 dark:text-slate-400','Scegli la tipologia qui sopra per vedere gli altri campi.'))}
  else{const T=TYPES[cur];$('#formTitle').textContent='3 · Dettagli · '+T.n;f.appendChild(mk([...T.f,...COMMON_BOT]))}
  if(fk){const q='[data-k="'+fk+'"]';const t=document.querySelector(q+':checked')||document.querySelector(q);if(t)t.focus()}
}

function build(){
  const T=TYPES[cur],d=data,g=k=>(d[k]||'').toString().trim(),one=s=>s.replace(/\s*\n+\s*/g,' ');
  const cl=g('cliente'),tk=g('ticket'),u=g('utente'),st=d.stato||STATI[0],si=STATI.indexOf(st);
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1),ph=k=>g(k)?one(g(k)):'(da compilare)';
  const val=fd=>{let v=g(fd.id);const x=g(fd.id+'_x');if(fd.x&&v===fd.x.when&&x)v=fd.x.rep?x:v+' – '+x;return v};
  const sec=(l,a)=>{a=a.filter(Boolean);return !a.length?'':a.length===1&&!a[0].includes('\n')?`${l}: ${a[0].replace(/^- /,'')}`:`${l}:\n${a.join('\n')}`};
  const rows=[],acts=[];
  T.f.forEach(fd=>{
    if(fd.t==='chk')acts.push(...(d[fd.id]||[]));
    else{const v=val(fd);if(v)rows.push([fd.l,one(v)])}
  });
  const risu=g('risultati'),azTxt=[acts.join('; '),one(risu)].filter(Boolean).join('. ');
  const hasAll=d.allegato===true,allX=g('allegato_x');
  const conf=g('conf');
  const cp=si===3?d.cp:'';
  const tr=tk?` (ticket ${tk})`:'';
  const grp=g('grp')||'(gruppo da indicare)';

  // 1) WORK NOTE interna: Motivo / Verifiche / Evidenze / Richiesta (routing)
  const head=`${si===2?'WORK NOTE · ROUTING → '+grp:'WORK NOTE'}\nTicket ${tk||'(n. da inserire)'} · ${T.n}\n${cl?'Cliente: '+cl+'\n':''}Utente: ${u||'non indicato'}\nStato: ${st}${cp?' ('+cp+')':''}\nAllegato: ${hasAll?'SÌ, VERIFICARE ALLEGATO'+(allX?' ('+allX+')':''):'No'}`;
  const ver=sec('Verifiche',[acts.map((a,i)=>`${i+1}. ${a}`).join('\n'),risu]);
  const evi=sec('Evidenze',[...rows.map(([l,v])=>`- ${l}: ${v}`),g('evidenze')&&'- '+one(g('evidenze')),hasAll&&"- Allegato: verificare l'allegato"+(allX?' ('+allX+')':'')]);
  const note=g('note')?'Note: '+g('note'):'';
  const B=[head];
  if(si===2){
    B.push(`Motivo: ${ph('problema').replace(/[.\s]+$/,'')}. Le verifiche di primo livello non hanno risolto il problema: si assegna la segnalazione al gruppo ${grp} per l'analisi e l'intervento di competenza.`,
      ver||'Verifiche: (da compilare)',evi||'Evidenze: (da compilare)','Richiesta: '+ph('richiesta'),note);
  }else{
    B.push(sec('Caso',[g('problema')]),ver,evi,note,['Prossimo passo: ticket in chiusura, vedere la nota di chiusura.',"Prossimo passo: in attesa dell'utente"+(g('inatt')?' ('+one(g('inatt'))+').':'.'),'',`Prossimo passo: ticket chiuso (${(cp||'').toLowerCase()}).`][si]);
  }
  if(cl)B.push('— Helpdesk '+cl);

  // 2) COMMENTO per l'utente: solo ciò che deve vedere il cliente
  const ex=cur==='pwd'&&d.tipo?`Abbiamo eseguito: ${d.tipo.toLowerCase()}${d.idv==='Sì'?', previa verifica della sua identità':''}.\n\n`:cur==='pc'&&d.tipo?`Intervento effettuato: ${d.tipo.toLowerCase()}.\n\n`:'';
  const prob=g('problema')?`Problema segnalato: ${one(g('problema'))}\n\n`:'';
  const act=acts.length?`Verifiche già effettuate:\n${acts.map(a=>'  - '+a).join('\n')}\n\n`:'';
  const body=[
    `${cap(T.intro)} le confermiamo che la segnalazione${tr} è stata risolta.\n\n${prob}${ex}${g('azris')?'Cosa abbiamo fatto: '+ph('azris')+'\n\n':''}${g('esito')?'Esito: '+ph('esito')+'\n\n':''}Se dovesse ripresentarsi, risponda a questa comunicazione e riapriremo subito la richiesta.`,
    `${cap(T.intro)} per proseguire${tr} abbiamo bisogno di un suo riscontro.\n\n${prob}${g('inatt')?'Informazioni richieste: '+ph('inatt')+'\n\n':''}In assenza di risposta potremmo dover chiudere il ticket.`,
    `${cap(T.intro)} serve un approfondimento specialistico${tr}: abbiamo quindi inoltrato la pratica al nostro supporto di secondo livello.\n\n${prob}${act}Cosa succede ora: il team specialistico analizzerà la segnalazione e la aggiorneremo sull'esito. Non sono necessarie altre azioni da parte sua, salvo nostra richiesta.`,
    cp===CP[0]?`Abbiamo provato a contattarla più volte${tr} senza riuscire a raggiungerla, per questo chiudiamo il ticket.\n\n${g('cp1')?'Tentativi di contatto: '+ph('cp1')+'\n\n':''}Può riaprirlo in qualsiasi momento rispondendo a questa comunicazione.`
    :cp===CP[1]?`La sua richiesta${tr} è già in gestione in un altro ticket.\n\n${g('cp2')?'Ticket di riferimento: '+ph('cp2')+'\n':''}${g('cp3')?'Motivo: '+ph('cp3')+'\n':''}\nChiudiamo questo per evitare duplicati: gli aggiornamenti arriveranno dal ticket principale.`
    :`${prob}La sua richiesta${tr} risulta fuori dal perimetro del nostro servizio. Per eventuali dubbi, la invitiamo a contattare il supporto IT interno.`][si];
  const usr=`Gentile ${u||'utente'},\n\n${body}\n\nCordiali saluti,\nHelpdesk ${cl||'IT'}`;

  // 3) NOTA DI CHIUSURA: Problema / Causa / Azioni / Esito / Conferma
  const ch=`NOTA DI CHIUSURA · Ticket ${tk||'(n. da inserire)'}${cl?' · '+cl:''}`,sig=cl?`\n— Helpdesk ${cl}`:'';
  let cls;
  if(si===0)cls=[ch,`Problema: ${ph('problema')}`,`Causa: ${ph('causa')}`,`Azioni: ${ph('azris')}`,`Esito: ${ph('esito')}`,
    `Conferma: ${conf?`${u||"L'utente"} ha confermato la risoluzione tramite ${conf.toLowerCase()}.`:'(indicare chi ha confermato e tramite quale canale)'}`].join('\n')+sig;
  else if(si===3)cls=[ch+' · '+cp,`Problema: ${ph('problema')}`,
    cp===CP[0]?`Tentativi di contatto: ${ph('cp1')}\nEsito: Ticket chiuso per mancato riscontro dell'utente, avvisato che la segnalazione può essere riaperta.`
    :cp===CP[1]?`Esito: Ticket duplicato.\nTicket principale di riferimento: ${ph('cp2')}\nMotivo della duplicazione: ${ph('cp3')}`
    :`Esito: Richiesta fuori perimetro. Utente informato e invitato a contattare l'IT interno per eventuali dubbi.`].join('\n')+sig;
  else cls='(Il ticket non è in chiusura: la nota di chiusura si genera con lo stato «Risolto al 1° livello» o «Chiuso: caso particolare».)';

  // Checklist (slide 11) + regole d'oro
  const bad=/(password|pwd|psw|pin|otp|token)\s*[:=]\s*\S+/i.test(Object.values(d).filter(v=>typeof v==='string').join(' '));
  const keys=['problema','richiesta','esito','causa','azris','note','risultati','evidenze','inatt'];
  const generic=keys.some(k=>/^(ok|fatto|risolto|funziona|inoltro|per competenza|verifichiamo|in lavorazione|\.)\.?$/i.test(g(k))||/\bx\s?cdc\b/i.test(g(k)))||['problema','richiesta','esito','causa','azris'].some(k=>g(k)&&g(k).length<10);
  const ver2=!!azTxt;
  const items=[
    [['Il cliente ha confermato il funzionamento',!!conf],['È stata descritta la risoluzione (problema, causa, azioni, esito)',!!(g('problema')&&g('causa')&&g('azris')&&g('esito'))]],
    [["Ho chiesto all'utente cosa serve, in modo chiaro",!!g('inatt')],['Ho indicato le verifiche già effettuate',ver2]],
    [['Ho scritto il motivo (caso + gruppo destinatario)',!!(g('problema')&&g('grp'))],['Ho indicato le verifiche già effettuate e i risultati',ver2],['Ho indicato le evidenze (log, screenshot, ecc.)',!!(g('evidenze')||hasAll||rows.length)],['Ho specificato cosa chiedo al team destinatario',!!g('richiesta')]],
    [['Caso particolare documentato',cp===CP[0]?!!g('cp1'):cp===CP[1]?!!(g('cp2')&&g('cp3')):true]]][si];
  items.push(['Ho rimosso i dati sensibili (controllo automatico su password, PIN, OTP)',!bad,true],['Note chiare e non generiche (evita «Ok», «Fatto», «Inoltro», «x cdc»)',!generic,true]);
  return {int:B.filter(Boolean).join('\n\n'),usr,cls,chk:{title:['Prima di chiudere','Prima di inviare','Prima di girare il ticket','Prima di chiudere'][si],items}};
}

let texts={int:'',usr:'',cls:''};
function gen(){
  if(cur)texts=build();else{const m='(Compila i dati e scegli la tipologia: la nota comparirà qui.)';texts={int:m,usr:m,cls:m,chk:{title:'Prima di iniziare',items:[['Scegli la tipologia',false]]}}}
  $('#out').value=texts[tab];renderChk(texts.chk);hint();fit()}

document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{
  texts[tab]=$('#out').value;tab=b.dataset.tab;
  document.querySelectorAll('.tabbtn').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#out').value=texts[tab];hint();fit()});

async function copy(txt){
  try{await navigator.clipboard.writeText(txt)}catch(e){const t=el('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  toast('Nota copiata negli appunti');
}
$('#copyBtn').onclick=()=>{if(!cur){toast('Scegli prima la tipologia');return}copy($('#out').value)};
$('#out').addEventListener('input',fit);
$('#newBtn').onclick=()=>{resetAll();scrollTo({top:0,behavior:'smooth'});toast('Pronto per un nuovo ticket')};
$('#clearBtn').onclick=()=>{resetAll();toast('Campi puliti')};

$('#saveBtn').onclick=()=>{
  if(!cur){toast('Scegli prima la tipologia');return}
  texts[tab]=$('#out').value;
  hist.unshift({id:Date.now(),type:cur,ticket:data.ticket||'',utente:data.utente||'',stato:data.stato,fav:false,int:texts.int,usr:texts.usr,cls:texts.cls,data:JSON.parse(JSON.stringify(data))});
  hist=hist.slice(0,200);LS('hist',hist);renderHist();toast('Salvata nella cronologia');
};

function renderHist(){
  const q=$('#search').value.toLowerCase(),box=$('#hist');box.innerHTML='';
  $('#fAll').className='px-3 py-1.5 '+(filt==='all'?'bg-teal-600 text-white':'');
  $('#fFav').className='px-3 py-1.5 '+(filt==='fav'?'bg-teal-600 text-white':'');
  const list=hist.filter(h=>(filt==='all'||h.fav)&&(!q||(h.ticket+h.utente+h.int).toLowerCase().includes(q)));
  if(!list.length){box.appendChild(el('p','text-sm text-slate-500 col-span-full',hist.length?'Nessun risultato.':'Nessuna nota salvata. Compila il form e usa "Salva nella cronologia".'));return}
  list.forEach(h=>{
    const c=el('div','rounded-lg border border-slate-200 dark:border-slate-700 p-3 flex flex-col gap-2');
    const top=el('div','flex items-start justify-between gap-2');
    const ti=el('div');ti.appendChild(el('div','font-semibold text-sm',`${TYPES[h.type].n}${h.ticket?' · '+h.ticket:''}`));
    ti.appendChild(el('div','text-xs text-slate-500 dark:text-slate-400',`${h.utente||'—'} · ${h.stato} · ${new Date(h.id).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'})}`));
    const fav=el('button','text-xl leading-none '+(h.fav?'text-amber-500':'text-slate-400'),h.fav?'★':'☆');fav.title='Preferito';fav.onclick=()=>{h.fav=!h.fav;LS('hist',hist);renderHist()};
    top.append(ti,fav);
    const pre=el('pre','text-xs font-mono whitespace-pre-wrap max-h-24 overflow-hidden text-slate-600 dark:text-slate-300',h.int);
    const bar=el('div','flex flex-wrap gap-2 text-xs');
    const mk=(t,fn,cls='')=>{const b=el('button','rounded border border-slate-300 dark:border-slate-600 px-2 py-1 hover:bg-slate-100 dark:hover:bg-slate-700 '+cls,t);b.onclick=fn;bar.appendChild(b)};
    mk('Work note',()=>copy(h.int));mk('Commento',()=>copy(h.usr));if(h.cls)mk('Chiusura',()=>copy(h.cls));
    mk('Riapri',()=>{cur=h.type;data=JSON.parse(JSON.stringify(h.data));renderTypes();renderForm();gen();scrollTo({top:0,behavior:'smooth'})});
    mk('Elimina',()=>{if(confirm('Eliminare questa nota?')){hist=hist.filter(x=>x!==h);LS('hist',hist);renderHist()}},'text-red-600 dark:text-red-400');
    c.append(top,pre,bar);box.appendChild(c);
  });
}
$('#search').oninput=renderHist;
$('#fAll').onclick=()=>{filt='all';renderHist()};
$('#fFav').onclick=()=>{filt='fav';renderHist()};

// Tema
function applyTheme(d){document.documentElement.classList.toggle('dark',d);$('#themeBtn').textContent=d?'Tema chiaro':'Tema scuro'}
let dark=LS('dark');if(dark===null)dark=matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(dark);
$('#themeBtn').onclick=()=>{dark=!dark;LS('dark',dark);applyTheme(dark)};

renderTypes();renderForm();gen();renderHist();{const t=document.querySelector('[data-k="ticket"]');if(t)t.focus()}
</script>
</body>
</html>
