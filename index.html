<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generatore di Note · Helpdesk IT</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
  .inp{width:100%;border-radius:.5rem;border:1px solid #cbd5e1;background:#fff;padding:.5rem .75rem;font-size:.875rem;color:#0f172a}
  .dark .inp{background:#1e293b;border-color:#475569;color:#e2e8f0}
  .inp:focus{outline:2px solid #0d9488;outline-offset:1px}
  .lbl{display:block;font-size:.8rem;font-weight:600;margin-bottom:.25rem;color:#334155}
  .dark .lbl{color:#cbd5e1}
  .tabbtn[aria-selected=true]{border-color:#0d9488;color:#0d9488;font-weight:600}
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto p-4 md:p-6">

  <header class="flex items-center justify-between mb-5">
    <div>
      <h1 class="text-xl md:text-2xl font-bold">Generatore di note Helpdesk</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Note interne ITSM e comunicazioni per l'utente, pronte da copiare.</p>
    </div>
    <button id="themeBtn" class="rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Cambia tema">Tema</button>
  </header>

  <div id="types" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 mb-5"></div>

  <div class="grid lg:grid-cols-2 gap-5">
    <section class="rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 md:p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 id="formTitle" class="font-semibold"></h2>
        <button id="clearBtn" class="text-sm rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700">Pulisci campi</button>
      </div>
      <div id="form" class="space-y-3"></div>
    </section>

    <section class="rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 md:p-5 flex flex-col">
      <div class="flex gap-4 border-b border-slate-200 dark:border-slate-700 mb-3" role="tablist">
        <button class="tabbtn border-b-2 border-transparent pb-2 text-sm" role="tab" data-tab="int" aria-selected="true">Nota interna ticket</button>
        <button class="tabbtn border-b-2 border-transparent pb-2 text-sm" role="tab" data-tab="usr" aria-selected="false">Comunicazione per utente</button>
      </div>
      <textarea id="out" class="inp flex-1 min-h-[22rem] font-mono leading-relaxed" spellcheck="false"></textarea>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Il testo è modificabile prima della copia; cambiando un campo del form viene rigenerato.</p>
      <div class="flex flex-wrap gap-2 mt-3">
        <button id="copyBtn" class="flex-1 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold px-4 py-2.5">Copia nota</button>
        <button id="saveBtn" class="rounded-lg border border-teal-600 text-teal-700 dark:text-teal-400 font-semibold px-4 py-2.5 hover:bg-teal-50 dark:hover:bg-slate-700">Salva nella cronologia</button>
      </div>
    </section>
  </div>

  <section class="mt-5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 md:p-5">
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <h2 class="font-semibold mr-auto">Note salvate</h2>
      <input id="search" class="inp !w-48" placeholder="Cerca (ticket, utente...)">
      <div class="flex rounded-lg overflow-hidden border border-slate-300 dark:border-slate-600 text-sm">
        <button id="fAll" class="px-3 py-1.5">Tutte</button>
        <button id="fFav" class="px-3 py-1.5">Preferiti</button>
      </div>
    </div>
    <div id="hist" class="grid md:grid-cols-2 xl:grid-cols-3 gap-3"></div>
  </section>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg hidden"></div>

<script>
const STATI=['Risolto al 1° livello','In attesa utente','Scalato al 2° livello'];
const SN=['Sì','No'];
const TYPES={
 pwd:{n:'Reset password / Sblocco AD',tag:'AD',intro:"in merito alla sua richiesta relativa all'account di rete,",f:[
  {id:'tipo',l:'Intervento',t:'sel',o:['Reset password','Sblocco account','Reset e sblocco']},
  {id:'idv',l:'Identità verificata',t:'sel',o:SN},
  {id:'metodo',l:'Metodo di verifica identità',t:'sel',o:['Domanda di sicurezza','Chiamata al numero registrato','Conferma del responsabile','Verifica di persona (badge/documento)','Codice via SMS/email aziendale','Altro (specificare)'],x:{when:'Altro (specificare)',p:'Descrivi il metodo usato',rep:1}}]},
 prn:{n:'Stampante / Periferica',tag:'STAMPANTE',intro:'in merito al problema con la stampante/periferica segnalato,',f:[
  {id:'host',l:'Hostname / IP',t:'txt'},{id:'mod',l:'Modello',t:'txt'},{id:'sede',l:'Reparto / Sede',t:'txt'},
  {id:'err',l:'Errore riscontrato',t:'area'},
  {id:'az',l:'Azioni eseguite',t:'chk',o:['Ping','Riavvio spooler','Reinstallazione driver','Riavvio stampante','Pulizia coda di stampa','Verifica cavo/rete','Pagina di test']}]},
 net:{n:'Rete / VPN',tag:'RETE',intro:'in merito al problema di connettività segnalato,',f:[
  {id:'ip',l:'Indirizzo IP utente',t:'txt'},{id:'conn',l:'Tipo connessione',t:'sel',o:['Wi-Fi','Cavo','VPN']},
  {id:'host',l:'Hostname PC',t:'txt'},{id:'ping',l:'Esito Ping / Traceroute',t:'area'},
  {id:'az',l:'Azioni eseguite',t:'chk',o:['Ipconfig /release /renew','Flush DNS','Riavvio adattatore','Reinstallazione client VPN','Verifica credenziali','Cambio porta/AP']}]},
 pc:{n:'Postazione di lavoro',tag:'POSTAZIONE',intro:'in merito alla sua postazione di lavoro,',f:[
  {id:'tipo',l:'Intervento',t:'sel',o:['Setup nuova postazione','Sostituzione PC/Laptop']},
  {id:'host',l:'Hostname',t:'txt'},{id:'mod',l:'Modello / Asset tag',t:'txt'},
  {id:'az',l:'Azioni eseguite',t:'chk',o:['Join al dominio','Installazione software base','Migrazione dati','Configurazione stampanti','Ritiro vecchia postazione','Aggiornamento inventario']}]},
 sw:{n:'Software',tag:'SOFTWARE',intro:'in merito al problema con il software segnalato,',f:[
  {id:'sw',l:'Software e versione',t:'txt'},{id:'err',l:'Errore / Sintomo',t:'area'},{id:'host',l:'Hostname PC',t:'txt'},
  {id:'az',l:'Azioni eseguite',t:'chk',o:['Installazione','Reinstallazione','Riparazione','Aggiornamento','Pulizia cache/profilo','Verifica licenza','Riavvio PC']}]},
 gen:{n:'Generico / Altro',tag:'GENERICO',intro:'in merito alla sua richiesta,',f:[
  {id:'ogg',l:'Oggetto',t:'txt'},{id:'desc',l:'Descrizione del problema',t:'area'},{id:'az',l:'Azioni eseguite',t:'area'}]}
};
const COMMON_TOP=[{id:'ticket',l:'N° ticket',t:'txt',p:'INC0001234'},{id:'utente',l:'Utente',t:'txt',p:'Nome Cognome / username'}];
const COMMON_BOT=[{id:'allegato',l:'Allegato al ticket',t:'sel',o:['No','Sì'],x:{when:'Sì',p:'Cosa contiene? (screenshot, log, foto...)'}},{id:'note',l:'Note aggiuntive',t:'area'},{id:'stato',l:'Stato finale',t:'sel',o:STATI}];

const $=s=>document.querySelector(s);
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let cur=LS('type')||'pwd', tab='int', filt='all', data={}, hist=LS('hist')||[];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),1800)}

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}

function renderTypes(){
  const box=$('#types');box.innerHTML='';
  Object.entries(TYPES).forEach(([k,v])=>{
    const b=el('button','rounded-lg border px-3 py-3 text-sm text-left font-medium '+(k===cur?'bg-teal-600 border-teal-600 text-white':'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 hover:border-teal-500'),v.n);
    b.onclick=()=>{cur=k;LS('type',k);data={};renderTypes();renderForm();gen()};
    box.appendChild(b);
  });
}

function renderForm(){
  const T=TYPES[cur];$('#formTitle').textContent=T.n;
  const f=$('#form');f.innerHTML='';
  const grid=el('div','grid sm:grid-cols-2 gap-3');
  [...COMMON_TOP,...T.f,...COMMON_BOT].forEach(fd=>{
    const w=el('div',fd.t==='area'||fd.t==='chk'?'sm:col-span-2':'');
    w.appendChild(el('label','lbl',fd.l));
    let i;
    if(fd.t==='sel'){i=el('select','inp');fd.o.forEach(o=>i.appendChild(new Option(o,o)));if(!data[fd.id])data[fd.id]=fd.o[0];i.value=data[fd.id];i.onchange=()=>{data[fd.id]=i.value;if(fd.x){renderForm()}gen()}}
    else if(fd.t==='chk'){i=el('div','flex flex-wrap gap-2');const sel=data[fd.id]=data[fd.id]||[];
      fd.o.forEach(o=>{const l=el('label','flex items-center gap-1.5 text-sm rounded-md border border-slate-300 dark:border-slate-600 px-2 py-1 cursor-pointer');
        const c=el('input');c.type='checkbox';c.checked=sel.includes(o);c.onchange=()=>{const a=data[fd.id];c.checked?a.push(o):a.splice(a.indexOf(o),1);gen()};
        l.append(c,o);i.appendChild(l)});
      const x=el('input','inp mt-1 w-full basis-full');x.placeholder='Altre azioni (separate da virgola)';x.value=data[fd.id+'_x']||'';x.oninput=()=>{data[fd.id+'_x']=x.value;gen()};i.appendChild(x)}
    else{i=el(fd.t==='area'?'textarea':'input','inp');if(fd.t==='area')i.rows=3;if(fd.p)i.placeholder=fd.p;i.value=data[fd.id]||'';i.oninput=()=>{data[fd.id]=i.value;gen()}}
    w.appendChild(i);
    if(fd.x&&data[fd.id]===fd.x.when){const x=el('input','inp mt-2');x.placeholder=fd.x.p;x.value=data[fd.id+'_x']||'';x.oninput=()=>{data[fd.id+'_x']=x.value;gen()};w.appendChild(x)}
    grid.appendChild(w);
  });
  f.appendChild(grid);
}

function actions(fd){const a=[...(data[fd.id]||[])];(data[fd.id+'_x']||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>a.push(s));return a}

function build(){
  const T=TYPES[cur],d=data;
  const tk=(d.ticket||'').trim(),u=(d.utente||'').trim(),st=d.stato||STATI[0];
  const val=fd=>{let v=(d[fd.id]||'').toString().trim();const x=(d[fd.id+'_x']||'').trim();
    if(fd.x&&v===fd.x.when&&x)v=fd.x.rep?x:v+' – '+x;return v};
  const rows=[],acts=[];
  T.f.forEach(fd=>{
    if(fd.t==='chk'){acts.push(...actions(fd))}
    else if(fd.id==='az'){(d.az||'').split(/\n|,/).map(s=>s.trim()).filter(Boolean).forEach(s=>acts.push(s))}
    else{const v=val(fd);if(v)rows.push([fd.l,v.replace(/\n/g,' ')])}
  });
  const hasAll=d.allegato==='Sì',allX=(d.allegato_x||'').trim();
  const next=["Nessuno, ticket chiudibile.","In attesa di riscontro dall'utente.","Presa in carico dal 2° livello."][STATI.indexOf(st)];
  const blocks=[];
  blocks.push(`TICKET ${tk||'(n. da inserire)'} · ${T.n}\nStato: ${st}\nUtente: ${u||'non indicato'}\nAllegato: ${hasAll?'SÌ, VERIFICARE ALLEGATO'+(allX?' ('+allX+')':''):'No'}`);
  if(rows.length)blocks.push('DETTAGLI\n'+rows.map(([l,v])=>`- ${l}: ${v}`).join('\n'));
  if(acts.length)blocks.push('AZIONI SVOLTE\n'+acts.map((a,i)=>`${i+1}. ${a}`).join('\n'));
  if((d.note||'').trim())blocks.push('NOTE\n'+d.note.trim());
  blocks.push('PROSSIMO PASSO\n'+next);
  const n=blocks.join('\n\n');
  const tail=[
    "Il problema è stato risolto. La invitiamo a verificare il corretto funzionamento: se dovesse ripresentarsi, risponda a questa email e riapriremo subito la richiesta.",
    "Per proseguire abbiamo bisogno di un suo riscontro. In assenza di risposta, il ticket potrebbe essere chiuso automaticamente dopo alcuni giorni.",
    "Poiché la richiesta richiede un approfondimento specialistico, l'abbiamo inoltrata al nostro supporto di secondo livello. Sarà aggiornato appena possibile sugli sviluppi."][STATI.indexOf(st)];
  let m=`Gentile ${u||'utente'},\n\n${T.intro} la informiamo sull'esito della verifica${tk?' (ticket '+tk+')':''}.\n\n`;
  if(cur==='pwd')m+=`Abbiamo eseguito: ${d.tipo.toLowerCase()}${d.idv==='Sì'?', previa verifica della sua identità':''}.\n\n`;
  else if(cur==='pc')m+=`Intervento effettuato: ${d.tipo.toLowerCase()}.\n\n`;
  if(acts.length)m+=`Attività svolte:\n${acts.map(a=>'  - '+a).join('\n')}\n\n`;
  if((d.note||'').trim())m+=`${d.note.trim()}\n\n`;
  m+=`${tail}\n\nCordiali saluti,\nHelpdesk IT`;
  return {int:n,usr:m};
}

let texts={int:'',usr:''};
function gen(){texts=build();$('#out').value=texts[tab]}

document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{
  texts[tab]=$('#out').value;tab=b.dataset.tab;
  document.querySelectorAll('.tabbtn').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#out').value=texts[tab]});

async function copy(txt){
  try{await navigator.clipboard.writeText(txt)}catch(e){const t=el('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  toast('Nota copiata negli appunti');
}
$('#copyBtn').onclick=()=>copy($('#out').value);
$('#clearBtn').onclick=()=>{data={};renderForm();gen();toast('Campi puliti')};

$('#saveBtn').onclick=()=>{
  texts[tab]=$('#out').value;
  hist.unshift({id:Date.now(),type:cur,ticket:data.ticket||'',utente:data.utente||'',stato:data.stato,fav:false,int:texts.int,usr:texts.usr,data:JSON.parse(JSON.stringify(data))});
  hist=hist.slice(0,200);LS('hist',hist);renderHist();toast('Salvata nella cronologia');
};

function renderHist(){
  const q=$('#search').value.toLowerCase(),box=$('#hist');box.innerHTML='';
  $('#fAll').className='px-3 py-1.5 '+(filt==='all'?'bg-teal-600 text-white':'');
  $('#fFav').className='px-3 py-1.5 '+(filt==='fav'?'bg-teal-600 text-white':'');
  const list=hist.filter(h=>(filt==='all'||h.fav)&&(!q||(h.ticket+h.utente+h.int).toLowerCase().includes(q)));
  if(!list.length){box.appendChild(el('p','text-sm text-slate-500 col-span-full',hist.length?'Nessun risultato.':'Nessuna nota salvata. Compila il form e usa "Salva nella cronologia".'));return}
  list.forEach(h=>{
    const c=el('div','rounded-lg border border-slate-200 dark:border-slate-700 p-3 flex flex-col gap-2');
    const top=el('div','flex items-start justify-between gap-2');
    const ti=el('div');ti.appendChild(el('div','font-semibold text-sm',`${TYPES[h.type].n}${h.ticket?' · '+h.ticket:''}`));
    ti.appendChild(el('div','text-xs text-slate-500 dark:text-slate-400',`${h.utente||'—'} · ${h.stato} · ${new Date(h.id).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'})}`));
    const fav=el('button','text-xl leading-none '+(h.fav?'text-amber-500':'text-slate-400'),h.fav?'★':'☆');fav.title='Preferito';fav.onclick=()=>{h.fav=!h.fav;LS('hist',hist);renderHist()};
    top.append(ti,fav);
    const pre=el('pre','text-xs font-mono whitespace-pre-wrap max-h-24 overflow-hidden text-slate-600 dark:text-slate-300',h.int);
    const bar=el('div','flex flex-wrap gap-2 text-xs');
    const mk=(t,fn,cls='')=>{const b=el('button','rounded border border-slate-300 dark:border-slate-600 px-2 py-1 hover:bg-slate-100 dark:hover:bg-slate-700 '+cls,t);b.onclick=fn;bar.appendChild(b)};
    mk('Copia nota',()=>copy(h.int));mk('Copia email',()=>copy(h.usr));
    mk('Riapri',()=>{cur=h.type;LS('type',cur);data=JSON.parse(JSON.stringify(h.data));renderTypes();renderForm();gen();scrollTo({top:0,behavior:'smooth'})});
    mk('Elimina',()=>{if(confirm('Eliminare questa nota?')){hist=hist.filter(x=>x!==h);LS('hist',hist);renderHist()}},'text-red-600 dark:text-red-400');
    c.append(top,pre,bar);box.appendChild(c);
  });
}
$('#search').oninput=renderHist;
$('#fAll').onclick=()=>{filt='all';renderHist()};
$('#fFav').onclick=()=>{filt='fav';renderHist()};

// Tema
function applyTheme(d){document.documentElement.classList.toggle('dark',d);$('#themeBtn').textContent=d?'Tema chiaro':'Tema scuro'}
let dark=LS('dark');if(dark===null)dark=matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(dark);
$('#themeBtn').onclick=()=>{dark=!dark;LS('dark',dark);applyTheme(dark)};

if(!TYPES[cur])cur='pwd';
renderTypes();renderForm();gen();renderHist();
</script>
</body>
</html>
